services:
  db:
    image: postgres:17
    container_name: caterflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: caterflow
      POSTGRES_USER: caterflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - caterflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caterflow -d caterflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caterflow_postgres_data: